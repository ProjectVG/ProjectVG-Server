name: ${COMPOSE_PROJECT_NAME:-projectvg-api-server}

networks:
  projectvg-network:
    driver: bridge

volumes:
  projectvg-api-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-../data}/logs/api-server

services:
  api-server:
    image: projectvgapi:latest
    build:
      context: .
      dockerfile: ProjectVG.Api/Dockerfile
      target: production
      cache_from:
        - projectvgapi:latest
    container_name: ${CONTAINER_NAME:-api-server}
    ports:
      - "${API_PORT:-7910}:7900"
    cpus: '${API_CPU_LIMIT:-1.0}'
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    memswap_limit: ${API_MEMORY_LIMIT:-1g}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - SERVER_ID=${SERVER_ID:-api-server-001}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - MEMORY_BASE_URL=${MEMORY_BASE_URL}
      - STT_BASE_URL=${STT_BASE_URL}
      - TTS_BASE_URL=${TTS_BASE_URL}
      - TTS_API_KEY=${TTS_API_KEY}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=${JWT_REFRESH_TOKEN_LIFETIME_DAYS}
      - OAUTH2_ENABLED=${OAUTH2_ENABLED}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}
      - GOOGLE_OAUTH_AUTO_CREATE_USER=${GOOGLE_OAUTH_AUTO_CREATE_USER}
      - GOOGLE_OAUTH_DEFAULT_ROLE=${GOOGLE_OAUTH_DEFAULT_ROLE}
    volumes:
      - projectvg-api-logs:/app/logs
    networks:
      - projectvg-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s