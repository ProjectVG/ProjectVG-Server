version: '3.8'

services:
  projectvg-api:
    image: ghcr.io/projectvg/projectvgapi:latest
    container_name: projectvg-api
    ports:
      - "${API_PORT:-7910}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - .env
    networks:
      - projectvg-network
      - projectvg-external-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  projectvg-network:
    driver: bridge
  projectvg-external-db:
    external: true
    name: projectvg-external-db