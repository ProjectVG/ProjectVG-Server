name: 개발 환경 CI

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'

env:
  DOTNET_VERSION: '8.0.x'
  
jobs:
  build-and-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    
    steps:
    - name: 소스 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: .NET 환경 설정
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: NuGet 패키지 캐싱
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: 종속성 복원
      run: |
        echo "복원 중..."
        start_time=$(date +%s)
        dotnet restore ProjectVG.sln
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "복원 완료 (${duration}초)"
      
    - name: 솔루션 빌드
      run: |
        echo "🔨 빌드 중..."
        start_time=$(date +%s)
        dotnet build ProjectVG.sln --no-restore --configuration Release
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "빌드 완료 (${duration}초)"
      
    - name: 단위 테스트 실행
      run: |
        echo "테스트 중..."
        start_time=$(date +%s)
        dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory coverage
        end_time=$(date +%s)
        duration=$((end_time - start_time))
        echo "테스트 완료 (${duration}초)"
      
    - name: 코드 커버리지 리포트 생성
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'
        
    - name: PR에 커버리지 결과 댓글 추가
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
        
    - name: 테스트 결과 발행
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: 테스트 결과
        path: coverage/*.trx
        reporter: dotnet-trx
        
    - name: 빌드 상태 확인
      if: failure()
      run: |
        echo "❌ 빌드 실패"
        echo "단계를 확인하세요."
        exit 1